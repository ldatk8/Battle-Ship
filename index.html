<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle ship</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer type="module"></script>
</head>
<body>
    <h1>Battle ship</h1>
    <div class="container">
        <div class="grid my-grid">
        </div>
        <div class="grid opponment-grid">
        </div>
    </div>
    <div class="info">
        <div class="card my">
            <img src="./assert/image/avt.jpg" alt="Avatar">
            <div>
                <p class="name">Lang Dat</p>
                <p class="win">13</p>
            </div>
        </div>
    <div class="control">
            <button class="play">
                <img src="./assert/image/but_play.png" style="width: 100px;">
            </button>
            <output class="mess"></output>
        </div>
        <div class="card opponment">
            <img src="./assert/image/avt2.jpg" alt="Avatar">
            <div>
                <p class="name">Ai do choi</p>
                <p class="win">3</p>
            </div>
        </div>
    </div>

    <div id="status">
        <div class="flex_box mine">
            <button class="random">random shuffe</button>
            <button class="addShip">Add ship</button>
            <div class="advanceFeature">
                <div class="plane">
                    <img src="./assert/image/air.png" alt="plane attack">
                </div>
                <div class="radar">
                    <img src="./assert/image/radar.jpg" alt="radar find ship">
                </div>
            </div>
            <div class="ships">
                <div class="ship">
                    <img src="./assert/image/ship1.png" alt="ship1">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship2.png" alt="ship2">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship3.png" alt="ship3">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship4.png" alt="ship4">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship5.png" alt="ship4">
                </div>
            </div>

        </div>
        <div class="flex_box opponment">
            <button class="random">random shuffe</button>
            <div class="advanceFeature">
                <div class="plane">
                    <img src="./assert/image/air.png" alt="plane attack">
                </div>
                <div class="radar">
                    <img src="./assert/image/radar.jpg" alt="radar find ship">
                </div>
            </div>
            <div class="ships">
                <div class="ship">
                    <img src="./assert/image/ship1.png" alt="ship1">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship2.png" alt="ship2">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship3.png" alt="ship3">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship4.png" alt="ship4">
                </div>
                <div class="ship">
                    <img src="./assert/image/ship5.png" alt="ship4">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
